# Linker layout for Dug Out on the MEGA65, based on cc65's mega65.cfg.
# The program is loaded at $2001 in C65 mode. Below $8000 is ordinary RAM, but $8000-$BFFF has ROM laid over it; the start-up
# code (LOWCODE, ONCE) switches those ROMs off, after which all of $2001-$BFFF is usable. The stack and BSS sit at the top.
FEATURES {
    STARTADDRESS: default = $2001;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;   # 2k stack
    __HIMEM__:     type = weak, value = $C000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0018,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $0010;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __MAIN_LAST__,   size = __HIMEM__ - __STACKSIZE__ - __MAIN_LAST__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;  # uninitialized, but reserves output space
    HIGHCODE: load = MAIN,     type = ro,  optional = yes;   # placed last: runs from above $8000 once the ROMs are off
    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
